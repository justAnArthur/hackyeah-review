name = "HubMI.pl"
kind = "Partner task · Małopolska"
order = 6
deadline = "Sun 4 Oct 2026 11:00 CEST"
brief = """
Design, name and prototype the "digital heart" of the Małopolska Social Innovation Hub, an AI-based platform. Modules: (1) Social matchmaking, MANDATORY: the user describes a problem, the system finds similar cases and proposes existing innovations; (2) Knowledge store: regional challenges map, Library of Social Innovations, educational content, need-trend aggregation for admins; (3) Idea creator: idea flashcards, grant-application generator, innovation canvases, optional AI assistant; (4) Innovation tester: sign up to test, rate, give feedback; (5) Active communication with ROPS, mentors, partners; (6) Admin panel; (7) "Innovation middleman": AI assistant that adapts an innovation into a service for an institution.
Required: working MVP (matchmaking mandatory, each extra module scores more), UX/UI mockups, WCAG 2.1 AA target, scalable and integration-ready, data security, demo link plus mockups, estimated running and maintenance cost, video of at most 3 minutes, everything in Polish.
"""
checks = [
  "Which of the 7 modules exist in code (backend and UI), not only in docs?",
  "Was the project actually built for HubMI? Teams sometimes pivot to another task.",
]

