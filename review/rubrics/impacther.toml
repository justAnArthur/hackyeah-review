name = "ImpactHer"
kind = "Open task"
order = 5
deadline = "Sun 4 Oct 2026 11:00 CEST (open-task rules also mention 23:00)"
brief = """
A technology solution for a real challenge that disproportionately affects women (safety, health, education, career, access to services, digital participation). Start from a well-identified need and show practical, measurable impact.
"""
checks = [
  "Is the women-specific need explicit in the product, or only implied by naming?",
  "Is there a measurable-impact plan?",
  "Is the need evidenced (research, data, the target group's own words) rather than assumed by naming?",
]

[weights]
"Idea & Innovation" = 30
"Relation to Category" = 20
"Practical Applicability / Usability" = 20
"Design (visual/UI)" = 20
"Completeness & Implementation Value" = 10
